services:
  - type: web
    name: exhibit-validator-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false  # Bạn sẽ điền key thật trên giao diện web của Render
      - key: DASHSCOPE_MODEL
        value: deepseek-v4.1-flash-1017