[project]
name = "exhibit-validator"
version = "0.1.0"
description = "Intent-driven validation pipeline for heterogeneous POI data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "openai>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
exhibit-validator = "exhibit_validator.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]